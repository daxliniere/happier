name: BUILD — Windows desktop (fork dev, unsigned)

# Fork-only workflow: builds an unsigned NSIS installer for the "Happier (dev)" desktop app.
# No release bot, signing keys or publishing; output is a downloadable workflow artifact.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: dev
        type: string

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Enable Yarn 1
        run: corepack enable

      - name: Install dependencies
        env:
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          npm_config_registry: https://registry.npmjs.org
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Build internal packages
        run: yarn -s build:packages

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ui/src-tauri
          # A new key forces a clean Rust build; the earlier shared cache produced an installer whose
          # embedded update feed and UI did not match the checked-out commit.
          key: fresh-rc3

      - name: Build Tauri NSIS installer
        run: yarn --cwd apps/ui tauri:build:dev --bundles nsis

      - name: Verify the installer carries the fork update feed
        shell: bash
        run: |
          installer="$(ls apps/ui/src-tauri/target/release/bundle/nsis/*.exe | head -1)"
          mkdir -p "$RUNNER_TEMP/installer-check"
          7z x -y "$installer" -o"$RUNNER_TEMP/installer-check" > /dev/null
          exe="$RUNNER_TEMP/installer-check/happier-desktop-dev.exe"
          grep -a -q 'daxliniere/happier/releases/download/ui-desktop-dev/latest.json' "$exe" || { echo "installer does not embed the fork update feed"; exit 1; }
          if grep -a -q 'happier-dev/happier/releases/download/ui-desktop-dev/latest.json' "$exe"; then echo "installer embeds upstream's update feed"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: happier-windows-dev-nsis
          path: apps/ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
